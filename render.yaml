# Render Blueprint Specification for Cloud Optimization Dashboard
services:
  # Backend API Service
  - type: web
    name: cloud-optimization-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-optimization-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Frontend Static Site
  - type: web
    name: cloud-optimization-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cloud-optimization-backend
          property: host

databases:
  - name: cloud-optimization-db
    plan: free
    region: oregon
    postgresMajorVersion: 15
